name: Release
on:
  push:
    tags: ['1.*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
      - name: Verify release identity
        shell: bash
        run: |
          version=$(sed -n 's/^meguviz.version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "$version"
          test "$version" = "$(printf '%s' "$version" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$')"
      - name: Install required Android platform
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Verify and package once
        run: bash gradlew -Pmeguviz.profile=android packageRelease --build-cache --no-daemon --console=plain
      - name: Publish same tested bytes to Maven and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          python tools/publish_maven.py --version "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" build/release/* --verify-tag --title "MeguvizRef $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-verification-${{ github.sha }}
          retention-days: 30
          path: |
            build/release/
            verification/host-gate/
            verification/compatibility-clients/receipt.json
            ref-*/build/test-results/
