name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE', 'NOTICE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install required Android platform
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Contracts, published consumers, ABI, lint and R8 in one build
        run: bash gradlew -Pmeguviz.profile=android verifyHost verifyAndroid --build-cache --no-daemon --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          retention-days: 7
          path: |
            verification/host-gate/
            verification/compatibility-clients/receipt.json
            ref-*/build/test-results/
            ref-android/build/reports/lint-results-release.*
